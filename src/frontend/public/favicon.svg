<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Cream background circle -->
  <circle cx="16" cy="16" r="15" fill="#F7F3EE"/>
  <!-- Crochet hook shape in dusty rose -->
  <!-- Hook handle (diagonal rod) -->
  <rect x="17.5" y="5" width="3.2" height="15" rx="1.6" ry="1.6"
        fill="#D8A7B1"
        transform="rotate(18 19 12.5)"/>
  <!-- Hook neck -->
  <rect x="8.5" y="17" width="3" height="5.5" rx="1.5" ry="1.5"
        fill="#D8A7B1"/>
  <!-- Hook curve (half-circle) -->
  <path d="M8.5 17 Q5 17 5 21 Q5 25.5 9.5 25.5 L11.5 25.5"
        fill="none" stroke="#D8A7B1" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tiny yarn ball accent in sage green -->
  <circle cx="24" cy="24" r="4" fill="#A8B5A2"/>
  <path d="M21 24 Q24 21 27 24" fill="none" stroke="#F7F3EE" stroke-width="1" stroke-linecap="round"/>
  <path d="M21 25.5 Q24 22.5 27 25.5" fill="none" stroke="#F7F3EE" stroke-width="1" stroke-linecap="round"/>
</svg>
